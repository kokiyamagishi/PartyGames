<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ການແຂ່ງຂັນເປັດ 15 ວິນາທີ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@600;800;900&family=Creepster&display=swap');

    body {
      font-family: 'Noto Sans Lao', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    .font-creep {
      font-family: 'Creepster', 'Noto Sans Lao', cursive;
    }

    /* 水面の波アニメーション */
    .water-bg {
      background: linear-gradient(180deg, #0284c7 0%, #0369a1 50%, #075985 100%);
      background-size: 100% 200%;
    }

    .wave-line {
      background: repeating-linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.15) 0px,
        rgba(255, 255, 255, 0.15) 20px,
        transparent 20px,
        transparent 40px
      );
      animation: waveFlow 2s linear infinite;
    }

    @keyframes waveFlow {
      0% { background-position: 0 0; }
      100% { background-position: -80px 0; }
    }

    /* アヒルの上下揺れ */
    @keyframes duckBob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(2deg); }
    }
    .duck-bob {
      animation: duckBob 0.6s ease-in-out infinite;
    }

    /* ホラー・ドクロの浮遊 */
    @keyframes skullFloat1 {
      0%, 100% { transform: translate(0, 0) rotate(-10deg) scale(1); }
      50% { transform: translate(10px, -15px) rotate(15deg) scale(1.15); }
    }
    @keyframes skullFloat2 {
      0%, 100% { transform: translate(0, 0) rotate(12deg) scale(1.1); }
      50% { transform: translate(-12px, -20px) rotate(-8deg) scale(0.95); }
    }
    .skull-float-1 { animation: skullFloat1 2.4s ease-in-out infinite; }
    .skull-float-2 { animation: skullFloat2 3s ease-in-out infinite; }

    /* 恐怖のパルス点滅 */
    @keyframes horrorPulse {
      0%, 100% {
        box-shadow: 0 0 35px rgba(220, 38, 38, 0.8), inset 0 0 30px rgba(0, 0, 0, 0.9);
        border-color: #ef4444;
      }
      50% {
        box-shadow: 0 0 60px rgba(168, 85, 247, 0.9), inset 0 0 50px rgba(185, 28, 28, 0.8);
        border-color: #a855f7;
      }
    }
    .horror-glow {
      animation: horrorPulse 1.8s infinite ease-in-out;
    }

    /* 稲妻ストロボ */
    @keyframes flashLightning {
      0%, 94%, 100% { opacity: 0; }
      95%, 97% { opacity: 0.4; background-color: #ffffff; }
      96% { opacity: 0.6; background-color: #ef4444; }
    }
    .lightning {
      animation: flashLightning 3.5s infinite;
    }

    /* 最下位ダックのガタガタ震え */
    @keyframes terrorShake {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-3px, 2px) rotate(-3deg); }
      40% { transform: translate(3px, -2px) rotate(3deg); }
      60% { transform: translate(-2px, -2px) rotate(-2deg); }
      80% { transform: translate(2px, 2px) rotate(2deg); }
    }
    .shake-terror {
      animation: terrorShake 0.15s infinite;
    }

    /* ゴールテープのチェック柄 */
    .finish-tape {
      background: repeating-linear-gradient(
        45deg,
        #fff,
        #fff 8px,
        #000 8px,
        #000 16px
      );
    }

    /* リアルタイム1位の黄金オーラ */
    @keyframes leaderGlow {
      0%, 100% { filter: drop-shadow(0 0 8px #facc15) drop-shadow(0 0 15px #eab308); }
      50% { filter: drop-shadow(0 0 14px #fef08a) drop-shadow(0 0 22px #ca8a04); }
    }
    .leader-duck {
      animation: duckBob 0.4s ease-in-out infinite, leaderGlow 1s ease-in-out infinite !important;
    }

    /* リアルタイム最下位の青ざめ＆危険オーラ */
    @keyframes dangerPulse {
      0%, 100% { filter: drop-shadow(0 0 8px #ef4444) hue-rotate(180deg) saturate(1.8); }
      50% { filter: drop-shadow(0 0 16px #dc2626) hue-rotate(210deg) saturate(2.2); }
    }
    .loser-duck-race {
      animation: terrorShake 0.12s infinite, dangerPulse 0.8s ease-in-out infinite !important;
    }

    /* 頭上マーカーの浮遊 */
    @keyframes badgeBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .badge-float {
      animation: badgeBounce 0.5s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between overflow-x-hidden">

  <header class="w-full max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="text-3xl">🦆</span>
      <h1 class="text-xl sm:text-2xl font-black tracking-wider text-amber-300 drop-shadow">QUACK DERBY</h1>
    </div>
    <div class="flex items-center gap-3">
      <span class="text-xs bg-slate-800 text-sky-400 font-black px-2.5 py-1 rounded-full border border-sky-500/30">ແຂ່ງ 15 ວິນາທີ</span>
      <button id="soundToggleBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-full px-3 py-1 text-sm font-bold transition flex items-center gap-1 shadow">
        <span id="soundIcon">🔊</span>
      </button>
    </div>
  </header>

  <!-- メイン表示領域 -->
  <main class="w-full max-w-4xl mx-auto px-3 sm:px-4 flex-1 flex flex-col justify-center">

    <section id="lobbyScreen" class="flex flex-col items-center gap-5 py-2">
      
      <!-- 参加ダック選択カード（6色） -->
      <div class="w-full grid grid-cols-2 sm:grid-cols-3 gap-3 sm:gap-4">
        <!-- 6羽のアヒルカード (JS動的生成) -->
        <div id="duckCardsContainer" class="contents"></div>
      </div>

      <!-- スタートボタン -->
      <div class="w-full max-w-sm flex flex-col items-center gap-2 pt-2">
        <button id="startRaceBtn" class="w-full py-4 bg-gradient-to-r from-amber-400 via-yellow-400 to-amber-500 hover:from-amber-300 hover:to-yellow-400 active:scale-95 text-slate-950 font-black text-xl rounded-2xl shadow-[0_6px_0_#b45309] hover:shadow-[0_4px_0_#b45309] transition flex items-center justify-center gap-3 border-2 border-yellow-200">
          <span class="text-2xl">🏁</span>
          <span>ເລີ່ມການແຂ່ງຂັນ (15s)</span>
        </button>
        <span id="entryCountNotice" class="text-xs text-slate-400 font-bold">ເລືອກ 0 ໂຕ (ກະລຸນາເລືອກ 2 ໂຕຂຶ້ນໄປ)</span>
      </div>
    </section>

    <section id="raceScreen" class="hidden flex-col items-center gap-3 py-2 w-full">
      
      <!-- タイマー & レース状況バー -->
      <div class="w-full flex items-center justify-between bg-slate-800/90 rounded-2xl px-3 sm:px-4 py-2 border border-slate-700 shadow-md gap-2">
        <div class="flex items-center gap-1.5 shrink-0">
          <span class="text-lg sm:text-xl">⏱️</span>
          <span id="raceTimerDisplay" class="font-mono text-2xl sm:text-3xl font-black text-amber-300">15.0s</span>
        </div>
        
        <!-- 1位 & 最下位の同時表示バッジ -->
        <div class="flex items-center gap-1.5 sm:gap-2 overflow-x-auto text-xs sm:text-sm">
          <div id="raceLeadBadge" class="font-black bg-amber-500/20 text-amber-300 border border-amber-500/50 px-2 sm:px-3 py-1 rounded-xl whitespace-nowrap shadow-[0_0_10px_rgba(245,158,11,0.3)]">
            👑 ທີ 1: ---
          </div>
          <div id="raceLastBadge" class="font-black bg-red-500/20 text-red-400 border border-red-500/60 px-2 sm:px-3 py-1 rounded-xl whitespace-nowrap animate-pulse shadow-[0_0_10px_rgba(239,68,68,0.4)]">
            💀 ຫຼ້າສຸດ: ---
          </div>
        </div>
      </div>

      <!-- 水上コース -->
      <div class="w-full bg-sky-950 rounded-2xl p-2 sm:p-3 border-2 border-sky-600/40 shadow-inner relative overflow-hidden">
        
        <!-- カウントダウン巨大オーバーレイ -->
        <div id="countdownOverlay" class="absolute inset-0 z-30 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center hidden">
          <span id="countdownNumber" class="text-7xl sm:text-8xl font-black text-yellow-300 drop-shadow-[0_0_25px_rgba(253,224,71,0.8)] scale-100 transition-all">3</span>
        </div>

        <!-- コースレーン群 -->
        <div id="lanesContainer" class="flex flex-col gap-2 relative">
          <!-- JSで動的にレーン描画 -->
        </div>

        <!-- ゴールライン -->
        <div class="absolute top-0 bottom-0 right-10 sm:right-14 w-3 finish-tape z-10 opacity-80 pointer-events-none border-x border-white/40"></div>
      </div>
    </section>

  </main>

  <div id="resultModal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden items-center justify-center p-3 sm:p-4">
    <div class="w-full max-w-md bg-gradient-to-b from-stone-950 via-zinc-950 to-red-950 rounded-3xl p-5 sm:p-6 border-4 border-red-600 shadow-[0_0_50px_rgba(220,38,38,0.7)] text-center flex flex-col gap-4 relative overflow-hidden horror-glow">
      
      <!-- 稲妻ストロボフラッシュ -->
      <div class="absolute inset-0 lightning pointer-events-none z-0"></div>

      <!-- 飛び交うドクロ装飾 -->
      <div class="absolute top-2 left-3 text-3xl sm:text-4xl skull-float-1 select-none pointer-events-none drop-shadow-[0_0_10px_#ef4444]">☠️</div>
      <div class="absolute top-3 right-3 text-3xl sm:text-4xl skull-float-2 select-none pointer-events-none drop-shadow-[0_0_10px_#ef4444]">💀</div>
      <div class="absolute bottom-16 left-4 text-2xl sm:text-3xl skull-float-2 select-none pointer-events-none opacity-80">🪦</div>
      <div class="absolute bottom-16 right-4 text-2xl sm:text-3xl skull-float-1 select-none pointer-events-none opacity-80">⛓️</div>

      <!-- 1位のコンパクト勝者表示 -->
      <div class="relative z-10 bg-black/60 border border-amber-400/50 rounded-xl px-3 py-1.5 flex items-center justify-between text-xs sm:text-sm">
        <span class="flex items-center gap-1.5 text-amber-300 font-bold">
          <span>🥇</span>
          <span>ຜູ້ຊະນະ (ທີ 1):</span>
          <span id="winnerName" class="text-white font-black">---</span>
        </span>
        <span id="winnerTime" class="font-mono text-amber-400 font-bold">14.9s</span>
      </div>

      <!-- 恐怖の最下位・罰ゲーム宣告エリア -->
      <div class="relative z-10 flex flex-col items-center pt-1 pb-2">
        
        <!-- ドクロアイコンヘッダー -->
        <div class="flex items-center gap-3 text-red-500 font-creep text-2xl sm:text-3xl tracking-widest drop-shadow-[0_0_15px_#dc2626]">
          <span>☠️</span>
          <span>ອັນດັບສຸດທ້າຍ</span>
          <span>☠️</span>
        </div>

        <!-- 恐怖の震える特大アヒル -->
        <div id="loserDuckContainer" class="w-32 h-32 sm:w-36 sm:h-36 flex items-center justify-center my-1 shake-terror">
          <!-- JSで特大青ざめアヒルを挿入 -->
        </div>

        <!-- 最下位の名前 -->
        <div id="loserName" class="text-2xl sm:text-3xl font-black text-red-400 drop-shadow-[0_0_12px_rgba(239,68,68,0.9)] tracking-wider">
          ---
        </div>

        <!-- 罰ゲーム執行スタンプ -->
        <div class="mt-3 bg-red-600 text-white font-black text-base sm:text-lg px-6 py-2 rounded-2xl border-2 border-red-300 shadow-[0_0_25px_rgba(220,38,38,0.9)] tracking-wider">
          ⚡ ຮັບການລົງໂທດ! ⚡
        </div>
      </div>

      <!-- アクションボタン -->
      <div class="relative z-10 grid grid-cols-2 gap-3 pt-1">
        <button id="rematchBtn" class="py-3 bg-red-700 hover:bg-red-600 active:scale-95 text-white font-black rounded-xl shadow-lg transition flex items-center justify-center gap-1.5 text-sm sm:text-base border border-red-400">
          <span>🔄</span>
          <span>ແຂ່ງອີກຄັ້ງ</span>
        </button>
        <button id="backToLobbyBtn" class="py-3 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 font-black rounded-xl shadow-lg transition flex items-center justify-center gap-1.5 text-sm sm:text-base border border-slate-600">
          <span>🦆</span>
          <span>ເລືອກເປັດ</span>
        </button>
      </div>

    </div>
  </div>

  <footer class="py-2 text-center text-xs text-slate-500 font-bold">
    15-Second Sprint Duck Race
  </footer>

  <script>
    // --- Web Audio Engine (外部音源ゼロ・効果音) ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playTone(freq, duration = 0.15, type = 'sine', gainVal = 0.2) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      }
      playQuack() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(420, now);
          osc.frequency.linearRampToValueAtTime(320, now + 0.15);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.18);
        } catch (e) {}
      }
      playCountdown(isGo = false) {
        if (isGo) {
          this.playTone(880, 0.4, 'triangle', 0.3);
        } else {
          this.playTone(440, 0.15, 'triangle', 0.25);
        }
      }
      // ホラーの重低音＆不吉な鐘
      playDoom() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          // 低音ドローン
          const osc1 = this.ctx.createOscillator();
          const gain1 = this.ctx.createGain();
          osc1.type = 'sawtooth';
          osc1.frequency.setValueAtTime(80, now);
          osc1.frequency.exponentialRampToValueAtTime(35, now + 2.0);
          gain1.gain.setValueAtTime(0.4, now);
          gain1.gain.exponentialRampToValueAtTime(0.001, now + 2.2);
          osc1.connect(gain1);
          gain1.connect(this.ctx.destination);
          osc1.start(now);
          osc1.stop(now + 2.2);

          // 不気味な不協和音 (ドクロの鐘)
          [220, 155.5, 110].forEach((f, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, now + i * 0.05);
            gain.gain.setValueAtTime(0.25, now + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 2.0);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * 0.05);
            osc.stop(now + 2.0);
          });
        } catch (e) {}
      }
    }
    const sound = new SoundEngine();

    // --- 6色のダックデータ (ラオス語表記・初期状態はすべて未選択) ---
    const DUCKS = [
      { id: 1, name: 'ສີເຫຼືອງ', color: '#facc15', accent: '#ca8a04', selected: false },
      { id: 2, name: 'ສີຟ້າ', color: '#38bdf8', accent: '#0284c7', selected: false },
      { id: 3, name: 'ສີບົວ', color: '#f472b6', accent: '#db2777', selected: false },
      { id: 4, name: 'ສີຂຽວ', color: '#4ade80', accent: '#16a34a', selected: false },
      { id: 5, name: 'ສີມ່ວງ', color: '#c084fc', accent: '#9333ea', selected: false },
      { id: 6, name: 'ສີສົ້ມ', color: '#fb923c', accent: '#ea580c', selected: false },
    ];

    // 通常の可愛いアヒルSVG
    function getDuckSvg(color, accent, size = 48) {
      return `
        <svg width="${size}" height="${size}" viewBox="0 0 100 100" class="duck-bob">
          <ellipse cx="46" cy="65" rx="36" ry="24" fill="${color}" />
          <path d="M12 68 Q5 58 18 56 Q22 62 25 65 Z" fill="${color}" />
          <ellipse cx="42" cy="68" rx="18" ry="11" fill="${accent}" transform="rotate(15 42 68)" />
          <circle cx="68" cy="42" r="22" fill="${color}" />
          <circle cx="75" cy="38" r="4.5" fill="#0f172a" />
          <circle cx="76.5" cy="36.5" r="1.5" fill="#ffffff" />
          <path d="M84 46 Q98 52 86 58 Q82 56 79 50 Z" fill="#f97316" />
        </svg>
      `;
    }

    // ホラー最下位・青ざめドクロアヒルSVG
    function getHorrorDuckSvg(color, accent, size = 120) {
      return `
        <svg width="${size}" height="${size}" viewBox="0 0 100 100" class="drop-shadow-[0_0_15px_#dc2626]">
          <ellipse cx="48" cy="85" rx="36" ry="9" fill="#000" opacity="0.6" />
          <ellipse cx="46" cy="65" rx="36" ry="24" fill="${color}" filter="grayscale(40%)" />
          <ellipse cx="42" cy="68" rx="18" ry="11" fill="${accent}" transform="rotate(15 42 68)" opacity="0.8" />
          <circle cx="68" cy="42" r="22" fill="${color}" filter="grayscale(40%)" />
          <!-- 恐怖の赤い瞳 -->
          <circle cx="74" cy="38" r="6" fill="#000" />
          <circle cx="74" cy="38" r="2.5" fill="#ef4444" />
          <!-- ガタガタの青ざめたクチバシ -->
          <path d="M84 46 Q98 53 88 59 Q80 57 78 50 Z" fill="#991b1b" />
          <!-- 涙の雫 -->
          <path d="M78 44 C78 44 74 50 74 53 C74 55 76 57 78 57 C80 57 82 55 82 53 C82 50 78 44 78 44 Z" fill="#67e8f9" />
        </svg>
      `;
    }

    // --- DOM要素 ---
    const lobbyScreen = document.getElementById('lobbyScreen');
    const raceScreen = document.getElementById('raceScreen');
    const duckCardsContainer = document.getElementById('duckCardsContainer');
    const startRaceBtn = document.getElementById('startRaceBtn');
    const entryCountNotice = document.getElementById('entryCountNotice');
    const soundToggleBtn = document.getElementById('soundToggleBtn');
    const soundIcon = document.getElementById('soundIcon');

    const countdownOverlay = document.getElementById('countdownOverlay');
    const countdownNumber = document.getElementById('countdownNumber');
    const raceTimerDisplay = document.getElementById('raceTimerDisplay');
    const raceLeadBadge = document.getElementById('raceLeadBadge');
    const raceLastBadge = document.getElementById('raceLastBadge');
    const lanesContainer = document.getElementById('lanesContainer');

    const resultModal = document.getElementById('resultModal');
    const winnerName = document.getElementById('winnerName');
    const winnerTime = document.getElementById('winnerTime');
    const loserDuckContainer = document.getElementById('loserDuckContainer');
    const loserName = document.getElementById('loserName');
    const rematchBtn = document.getElementById('rematchBtn');
    const backToLobbyBtn = document.getElementById('backToLobbyBtn');

    // --- レース状態管理 ---
    const RACE_DURATION = 15.0; // 15秒
    let activeDucks = [];
    let duckStates = []; // { id, name, progress: 0~100, speedBase, burst }
    let raceStartTime = 0;
    let raceAnimFrame = null;
    let isRacing = false;

    function renderLobby() {
      duckCardsContainer.innerHTML = '';
      let selectedCount = 0;

      DUCKS.forEach(duck => {
        if (duck.selected) selectedCount++;
        const card = document.createElement('div');
        const isSel = duck.selected;

        card.className = `cursor-pointer rounded-2xl p-3 border-2 transition flex flex-col items-center gap-2 relative ${
          isSel 
            ? 'bg-slate-800/90 border-amber-400 shadow-[0_0_15px_rgba(251,191,36,0.3)]' 
            : 'bg-slate-900/60 border-slate-700/60 opacity-40 hover:opacity-70'
        }`;

        card.innerHTML = `
          <div class="absolute top-2 right-2 text-sm font-black w-6 h-6 rounded-full flex items-center justify-center ${
            isSel ? 'bg-amber-400 text-slate-950' : 'bg-slate-700 text-slate-400'
          }">
            ${isSel ? '✓' : '×'}
          </div>
          <div class="w-16 h-16 flex items-center justify-center">
            ${getDuckSvg(duck.color, duck.accent, 56)}
          </div>
          <input 
            type="text" 
            value="${duck.name}" 
            maxlength="8"
            class="duck-name-input text-center text-sm font-black bg-slate-950/70 border border-slate-700 rounded-lg py-1 px-2 text-white w-full focus:border-amber-400 focus:outline-none"
            onclick="event.stopPropagation();"
          />
        `;

        // カードクリックでON/OFF
        card.addEventListener('click', () => {
          duck.selected = !duck.selected;
          sound.playQuack();
          renderLobby();
        });

        // 名前編集
        const nameInput = card.querySelector('.duck-name-input');
        nameInput.addEventListener('input', (e) => {
          duck.name = e.target.value.trim() || `ເປັດ ${duck.id}`;
        });

        duckCardsContainer.appendChild(card);
      });

      entryCountNotice.textContent = selectedCount < 2 
        ? `ເລືອກ ${selectedCount} ໂຕ (ກະລຸນາເລືອກ 2 ໂຕຂຶ້ນໄປ)`
        : `ເລືອກ ${selectedCount} ໂຕແລ້ວ! ພ້ອມເລີ່ມແຂ່ງຂັນ`;
      startRaceBtn.disabled = selectedCount < 2;
      startRaceBtn.style.opacity = selectedCount >= 2 ? '1' : '0.4';
      startRaceBtn.style.cursor = selectedCount >= 2 ? 'pointer' : 'not-allowed';
    }

    function startRace() {
      activeDucks = DUCKS.filter(d => d.selected);
      if (activeDucks.length < 2) return;

      lobbyScreen.classList.add('hidden');
      raceScreen.classList.remove('hidden');
      resultModal.classList.add('hidden');

      // レーンの描画
      lanesContainer.innerHTML = '';
      duckStates = activeDucks.map((duck, index) => {
        const lane = document.createElement('div');
        lane.className = 'w-full h-16 sm:h-20 water-bg rounded-xl relative overflow-hidden flex items-center border border-sky-400/20 shadow-inner';
        lane.innerHTML = `
          <!-- 波のエフェクト -->
          <div class="absolute inset-0 wave-line pointer-events-none opacity-40"></div>
          
          <!-- レーン番号・順位バッジ・名前 -->
          <div class="absolute left-2 z-20 bg-slate-950/80 backdrop-blur px-2 py-1 rounded-xl border border-slate-700 flex items-center gap-1.5 pointer-events-none shadow">
            <span id="rankBadge_${duck.id}" class="text-xs font-mono font-black px-1.5 py-0.5 rounded bg-slate-800 text-slate-300">#${index + 1}</span>
            <span class="text-xs font-black text-white max-w-[75px] sm:max-w-[100px] truncate">${duck.name}</span>
          </div>

          <!-- アヒル走行体 (頭上マーカー + アヒル本体 + 水しぶき) -->
          <div id="duckRunner_${duck.id}" class="absolute top-1/2 -translate-y-1/2 transition-[left] z-10 flex flex-col items-center" style="left: 2%;">
            
            <!-- 頭上インジケーター (👑 1位 / 💀 最下位など) -->
            <div id="overheadMarker_${duck.id}" class="badge-float opacity-0 -mb-1 px-1.5 py-0.5 rounded-full text-[10px] sm:text-xs font-black tracking-tighter whitespace-nowrap shadow-md transition-all"></div>
            
            <div id="duckBodyWrap_${duck.id}" class="flex items-center">
              ${getDuckSvg(duck.color, duck.accent, 46)}
              <!-- 水しぶき -->
              <div id="wakeSplash_${duck.id}" class="w-4 h-2 bg-white/40 rounded-full blur-[1px] -ml-2 -mb-2 transition-all"></div>
            </div>

          </div>
        `;
        lanesContainer.appendChild(lane);

        return {
          id: duck.id,
          name: duck.name,
          color: duck.color,
          accent: duck.accent,
          progress: 2, // 2%から82%(ゴール)まで
          element: lane.querySelector(`#duckRunner_${duck.id}`),
          bodyWrap: lane.querySelector(`#duckBodyWrap_${duck.id}`),
          overheadMarker: lane.querySelector(`#overheadMarker_${duck.id}`),
          rankBadge: lane.querySelector(`#rankBadge_${duck.id}`),
          wakeSplash: lane.querySelector(`#wakeSplash_${duck.id}`),
                    baseSpeed: 0.5 + Math.random() * 0.8,
          wobbleSpeed: 2 + Math.random() * 3,
          wobbleSize: 2 + Math.random() * 4,
          noiseSeed: Math.random() * 100,
          burstTime: 2 + Math.random() * 9,
          burstPower: 6 + Math.random() * 14,
          behavior: Math.random() < 0.25 ? "late_burst" : (Math.random() < 0.5 ? "fast_start_fail" : (Math.random() < 0.7 ? "stumble_then_rush" : "normal")),
          currentRank: index + 1
        };
      });

      // 3・2・1・GO カウントダウン
      runCountdown(() => {
        beginSprint();
      });
    }

    function runCountdown(callback) {
      countdownOverlay.classList.remove('hidden');
      let count = 3;
      countdownNumber.textContent = count;
      sound.playCountdown(false);

      const interval = setInterval(() => {
        count--;
        if (count > 0) {
          countdownNumber.textContent = count;
          sound.playCountdown(false);
        } else if (count === 0) {
          countdownNumber.textContent = 'ໄປ!'; // ラオス語のGO
          sound.playCountdown(true);
        } else {
          clearInterval(interval);
          countdownOverlay.classList.add('hidden');
          callback();
        }
      }, 700);
    }

    // 15秒スプリントの実行
    function beginSprint() {
      isRacing = true;
      raceStartTime = performance.now();

      function raceLoop(now) {
        if (!isRacing) return;
        const elapsed = (now - raceStartTime) / 1000;
        const remaining = Math.max(0, RACE_DURATION - elapsed);
        raceTimerDisplay.textContent = `${remaining.toFixed(1)}s`;

        // 進行度 0.0 ~ 1.0
        const overallProgress = Math.min(1.0, elapsed / RACE_DURATION);

        // 各ダックの位置計算
        duckStates.forEach(d => {
          let speedMod = d.baseSpeed;
          
          if (d.behavior === "late_burst" && elapsed > RACE_DURATION - 5) {
             speedMod += 0.85; 
          } else if (d.behavior === "fast_start_fail") {
             if (elapsed < 5) speedMod += 0.7;
             else if (elapsed > 10) speedMod -= 0.6;
          } else if (d.behavior === "stumble_then_rush") {
             if (elapsed < 6) speedMod -= 0.5;
             else if (elapsed > 10) speedMod += 1.1;
          }

          let prog = overallProgress * 80 * speedMod;
          const wobble = Math.sin((elapsed * d.wobbleSpeed) + d.noiseSeed) * d.wobbleSize;
          
          if (elapsed > d.burstTime && elapsed < d.burstTime + 3) {
            prog += d.burstPower * Math.sin(((elapsed - d.burstTime) / 3) * Math.PI);
          }

          d.progress = Math.max(2, 2 + prog + wobble);
          const renderProgress = Math.min(88, d.progress);
          d.element.style.left = `${renderProgress}%`;
        });

        // リアルタイム順位の判定
        const currentSorted = [...duckStates].sort((a, b) => b.progress - a.progress);
        const totalRacers = currentSorted.length;

        currentSorted.forEach((d, idx) => {
          d.currentRank = idx + 1;
          const isFirst = idx === 0;
          const isLast = idx === totalRacers - 1;

          // 1位の演出
          if (isFirst) {
            d.overheadMarker.innerHTML = '👑 ທີ 1';
            d.overheadMarker.className = 'badge-float opacity-100 -mb-1 px-2 py-0.5 rounded-full text-[10px] sm:text-xs font-black bg-gradient-to-r from-amber-300 to-yellow-400 text-slate-950 border border-yellow-100 shadow-[0_0_12px_#facc15]';
            d.bodyWrap.className = 'flex items-center leader-duck scale-110 transition-transform';
            d.rankBadge.textContent = 'ທີ 1';
            d.rankBadge.className = 'text-xs font-mono font-black px-1.5 py-0.5 rounded bg-amber-400 text-slate-950 font-black shadow-[0_0_8px_#facc15]';
            d.wakeSplash.className = 'w-7 h-3 bg-white/70 rounded-full blur-[1px] -ml-2 -mb-2 scale-125';
          } 
          // 最下位の演出
          else if (isLast) {
            d.overheadMarker.innerHTML = '💀 ຫຼ້າສຸດ!';
            d.overheadMarker.className = 'badge-float opacity-100 -mb-1 px-2 py-0.5 rounded-full text-[10px] sm:text-xs font-black bg-red-600 text-white border border-red-300 shadow-[0_0_12px_#ef4444] animate-pulse';
            d.bodyWrap.className = 'flex items-center loser-duck-race scale-95 transition-transform';
            d.rankBadge.textContent = 'ຫຼ້າສຸດ';
            d.rankBadge.className = 'text-xs font-mono font-black px-1.5 py-0.5 rounded bg-red-600 text-white font-black shadow-[0_0_8px_#dc2626]';
            d.wakeSplash.className = 'w-3 h-1.5 bg-cyan-300/30 rounded-full blur-[1px] -ml-2 -mb-2 opacity-50';
          } 
          // 2位〜中間の演出
          else {
            d.overheadMarker.innerHTML = `ທີ ${d.currentRank}`;
            d.overheadMarker.className = 'badge-float opacity-80 -mb-1 px-1.5 py-0.2 rounded-full text-[10px] font-black bg-slate-900/80 text-slate-300 border border-slate-600';
            d.bodyWrap.className = 'flex items-center';
            d.rankBadge.textContent = `ທີ ${d.currentRank}`;
            d.rankBadge.className = 'text-xs font-mono font-black px-1.5 py-0.5 rounded bg-slate-800 text-slate-300';
            d.wakeSplash.className = 'w-4 h-2 bg-white/40 rounded-full blur-[1px] -ml-2 -mb-2';
          }
        });

        // 画面上部ヘッダーの「1位」＆「最下位」をリアルタイム更新
        raceLeadBadge.textContent = `👑 ທີ 1: ${currentSorted[0].name}`;
        raceLastBadge.textContent = `💀 ຫຼ້າສຸດ: ${currentSorted[totalRacers - 1].name}`;

        if (elapsed < RACE_DURATION) {
          raceAnimFrame = requestAnimationFrame(raceLoop);
        } else {
          finishRace();
        }
      }

      raceAnimFrame = requestAnimationFrame(raceLoop);
    }

    function finishRace() {
      isRacing = false;
      raceTimerDisplay.textContent = `0.0s`;

      // 最終順位決定（同着回避の微小ランダム揺らぎ）
      const ranked = [...duckStates].sort((a, b) => b.progress - a.progress);
      const winner = ranked[0];
      const loser = ranked[ranked.length - 1]; // 最下位（ドベ）

      // 1位情報
      winnerName.textContent = winner.name;
      winnerTime.textContent = '14.8s';

      // 最下位（ドクロ・恐怖演出）
      loserName.textContent = loser.name;
      loserDuckContainer.innerHTML = getHorrorDuckSvg(loser.color, loser.accent, 120);

      // モーダル表示
      resultModal.classList.remove('hidden');
      resultModal.classList.add('flex');

      // 恐怖の終焉サウンド（ドクロの鐘）再生
      sound.playDoom();
    }

    startRaceBtn.addEventListener('click', () => {
      sound.init();
      startRace();
    });

    rematchBtn.addEventListener('click', () => {
      sound.init();
      startRace();
    });

    backToLobbyBtn.addEventListener('click', () => {
      resultModal.classList.add('hidden');
      resultModal.classList.remove('flex');
      raceScreen.classList.add('hidden');
      lobbyScreen.classList.remove('hidden');
      renderLobby();
    });

    soundToggleBtn.addEventListener('click', () => {
      sound.enabled = !sound.enabled;
      soundIcon.textContent = sound.enabled ? '🔊' : '🔇';
      if (sound.enabled) sound.playQuack();
    });

    // 初期化
    window.addEventListener('DOMContentLoaded', () => {
      renderLobby();
    });
  </script>
</body>
</html>
